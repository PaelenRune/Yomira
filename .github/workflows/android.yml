name: Yomira Android CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk release/yomira-v0.2.0-beta.apk
        cd release && sha256sum yomira-v0.2.0-beta.apk > SHA256SUMS.txt && cd ..

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yomira-v0.2.0-beta-apk
        path: release/yomira-v0.2.0-beta.apk

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*.apk
          release/SHA256SUMS.txt
          release/*.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
