name: Yomira CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Android)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Assemble Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Prepare Release Artifacts
      run: |
        VERSION="${GITHUB_REF_NAME:-v5.0.0}"
        mkdir -p release
        # Ship the signed, minified release build; the debug APK stays a CI artifact.
        cp app/build/outputs/apk/release/app-release.apk release/yomira-${VERSION}.apk
        cd release && sha256sum yomira-${VERSION}.apk > SHA256SUMS.txt && cd ..

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yomira-apk
        path: release/yomira-*.apk

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/yomira-*.apk
          release/SHA256SUMS.txt
          release/RELEASE_NOTES.md
        body_path: release/RELEASE_NOTES.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    # Windows/Desktop is postponed alongside its exclusion in settings.gradle.kts.
    if: ${{ false }}
    name: Build & Package Windows Desktop (.EXE / .MSI)
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Run Desktop Tests
      run: .\gradlew.bat :desktop:test --no-daemon

    - name: Package Windows Distributions (.EXE & .MSI)
      run: .\gradlew.bat :desktop:packageDistributionForCurrentOS --no-daemon

    - name: Upload Desktop Installers as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yomira-windows-desktop
        if-no-files-found: error
        path: |
          desktop/build/compose/binaries/main/exe/*.exe
          desktop/build/compose/binaries/main/msi/*.msi

    - name: Upload Windows Installers to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          desktop/build/compose/binaries/main/exe/*.exe
          desktop/build/compose/binaries/main/msi/*.msi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
