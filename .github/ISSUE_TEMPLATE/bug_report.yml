name: Hata Bildirimi / Bug Report
description: Yomira'daki çökmeleri ve hataları bildirin. / Report crashes and unexpected behavior in Yomira.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Türkçe veya İngilizce yazabilirsiniz. / You may write in Turkish or English.
        Kaynak veya eklenti sorunları için **Kaynak / Eklenti Hatası** formunu kullanın.
        For source or extension problems, use the **Source / Extension Issue** form.
        Güvenlik açıklarını herkese açık olarak paylaşmayın; bakımcılara özel olarak bildirin.
        Do not disclose security vulnerabilities publicly; contact the maintainers privately.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Ön kontroller / Before submitting
      options:
        - label: Mevcut bildirimleri aradım; aynı sorunu bulamadım. / I searched existing issues and found no duplicate.
          required: true
        - label: Sorunu en güncel sürümde denedim veya neden deneyemediğimi aşağıda açıkladım. / I tested the latest release or explained below why I could not.
          required: true

  - type: input
    id: version
    attributes:
      label: Yomira sürümü / Yomira version
      description: Tam sürümü veya kaynak derlemesi için commit kimliğini yazın. / Include the exact version or commit for source builds.
      placeholder: "vX.Y.Z / commit abc1234"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Cihaz modeli / Device model
      description: Üretici ve model; masaüstünde bilgisayar modeli. / Manufacturer and model; computer model for desktop.
      placeholder: "Samsung Galaxy S24 / Lenovo ThinkPad T14"
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: Android sürümü veya işletim sistemi / Android version or operating system
      description: Android sürümü ve varsa üretici arayüzü; diğer platformlarda işletim sistemi sürümü. / Android version and vendor skin, or OS version on other platforms.
      placeholder: "Android 14, One UI 6.1 / Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Tekrarlama adımları / Steps to reproduce
      description: Sorunu tekrar oluşturmak için gereken adımları sırayla yazın. / List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Kütüphaneyi açın. / Open the library.
        2. Bir başlık seçin. / Select a title.
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış / Expected behavior
      description: Ne olmasını bekliyordunuz? / What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış / Actual behavior
      description: Ne oldu? Varsa hata mesajını aynen ekleyin. / What happened? Include the exact error message, if any.
    validations:
      required: true

  - type: textarea
    id: logcat
    attributes:
      label: Logcat veya hata günlükleri / Logcat or error logs
      description: |
        İsteğe bağlı. Android'de adb logcat ile sorun anındaki ilgili satırları alın.
        Optional. On Android, use adb logcat and include relevant lines captured when the issue occurs.
        Paylaşmadan önce erişim belirteçlerini, çerezleri ve kişisel bilgileri silin. / Remove tokens, cookies, and personal information before sharing.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Ekran görüntüleri ve ek bilgiler / Screenshots and additional context
      description: Görselleri buraya sürükleyin; ağ koşullarını veya ilgili ayarları belirtin. / Drag images here; mention network conditions or relevant settings. Kişisel bilgileri gizleyin. / Hide personal information.
