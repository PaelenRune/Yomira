name: Source / Repository Issue
description: Report a broken extension source or request a new source repository.
title: "[Source]: "
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for problems with an extension source or repository listed in **Extensions → Repositories**.
        If the source itself is unavailable, please check its own project page before reporting it here.

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Is this about an existing source that stopped working, or a new source you would like to see?
      options:
        - Broken source
        - New source request
    validations:
      required: true

  - type: input
    id: source_name
    attributes:
      label: Source name
      description: The name of the source as it appears in Yomira.
      placeholder: e.g. Example Comics
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: The website the source reads from, or the repository URL that provides it.
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: The primary language of the content provided by this source.
      placeholder: e.g. English, Türkçe, Japanese, Multi-language
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        For a broken source, describe what fails (search, browsing, chapters, pages) and include any error message.
        For a new source request, describe the content it offers and why it would be a good addition.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, logs, or links to the source's own project page.
