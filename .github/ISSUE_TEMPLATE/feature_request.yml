name: Özellik Talebi / Feature Request
description: Yomira için yeni bir özellik veya iyileştirme önerin. / Suggest a feature or improvement for Yomira.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Türkçe veya İngilizce yazabilirsiniz. Önce ihtiyacınızı, sonra önerinizi anlatın.
        You may write in Turkish or English. Describe your need first, then your proposal.

  - type: checkboxes
    id: prechecks
    attributes:
      label: Ön kontroller / Before submitting
      options:
        - label: Mevcut talepleri aradım; aynı öneriyi bulamadım. / I searched existing requests and found no duplicate.
          required: true
        - label: Bu öneri Yomira uygulamasıyla ilgilidir. / This proposal concerns the Yomira application itself.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Hedef platform / Target platform
      options:
        - Android telefon / Android phone
        - Android tablet veya katlanabilir / Android tablet or foldable
        - Windows
        - Tüm platformlar / All platforms
        - Diğer / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: İhtiyaç veya sorun / Need or problem
      description: Hangi işi yapmaya çalışıyorsunuz ve mevcut davranış neden yetersiz? / What are you trying to accomplish, and why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Önerilen çözüm / Proposed solution
      description: Özellik nasıl çalışmalı? Somut bir kullanım örneği ekleyin. / How should the feature work? Include a concrete usage example.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Değerlendirilen alternatifler / Alternatives considered
      description: Denediğiniz geçici çözümler veya diğer tasarım fikirleri nelerdir? / What workarounds or other designs have you considered?

  - type: textarea
    id: additional
    attributes:
      label: Taslaklar ve ek bilgiler / Mockups and additional context
      description: Görselleri sürükleyin veya ilgili bağlantıları ekleyin. Kişisel bilgileri gizleyin. / Drag images here or add relevant links. Hide personal information.
