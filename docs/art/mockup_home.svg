<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06050C"/>
      <stop offset="100%" stop-color="#0c0a1a"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="50%" stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#12101F"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect x="180" y="20" width="440" height="960" rx="48" fill="#12101F" stroke="#2D284D" stroke-width="3"/>
  <rect x="194" y="34" width="412" height="932" rx="38" fill="url(#bgGrad)"/>

  <!-- Dynamic Island / Speaker Notch -->
  <rect x="330" y="46" width="140" height="26" rx="13" fill="#000000"/>

  <!-- Top App Bar -->
  <text x="224" y="112" fill="url(#neonGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1">YOMIRA</text>

  <!-- Grid Selector (2 / 3 / 4) -->
  <rect x="490" y="92" width="96" height="28" rx="8" fill="#18152B" stroke="#2D284D" stroke-width="1"/>
  <rect x="522" y="94" width="32" height="24" rx="6" fill="#9D4EDD"/>
  <text x="506" y="110" fill="#8E8D9A" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="538" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text x="570" y="110" fill="#8E8D9A" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>

  <!-- Search Bar -->
  <rect x="220" y="136" width="360" height="42" rx="12" fill="#141126" stroke="#241E3D" stroke-width="1"/>
  <circle cx="242" cy="157" r="6" fill="none" stroke="#8E8D9A" stroke-width="2"/>
  <line x1="247" y1="162" x2="254" y2="169" stroke="#8E8D9A" stroke-width="2"/>
  <text x="264" y="162" fill="#585473" font-family="sans-serif" font-size="13">Evrendeki tüm serilerde ara...</text>

  <!-- Hero Carousel -->
  <g transform="translate(220, 196)">
    <rect width="360" height="190" rx="18" fill="url(#heroGrad)" stroke="#9D4EDD" stroke-width="1.2"/>
    <!-- Glass rating pill -->
    <rect x="16" y="16" width="68" height="24" rx="12" fill="rgba(0,0,0,0.6)"/>
    <text x="50" y="32" fill="#FFB703" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">★ 9.8</text>
    <!-- Tag -->
    <rect x="280" y="16" width="64" height="22" rx="6" fill="#FF007F"/>
    <text x="312" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">TREND</text>

    <!-- Hero Title & Info -->
    <text x="18" y="118" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="18">Solo Leveling: Ragnarok</text>
    <text x="18" y="138" fill="#B3B0C7" font-family="sans-serif" font-size="12">Aksiyon • Fantastik • Webtoon</text>

    <!-- CTA Button -->
    <rect x="18" y="148" width="110" height="30" rx="8" fill="url(#neonGrad)"/>
    <text x="73" y="168" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Hemen Oku</text>
  </g>

  <!-- Section Header -->
  <text x="220" y="420" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16">Senin Vitrinin</text>
  <text x="580" y="420" fill="#9D4EDD" font-family="sans-serif" font-weight="600" font-size="12" text-anchor="end">Filtrele</text>

  <!-- 3-Column Grid -->
  <!-- Col 1: One Piece -->
  <g transform="translate(220, 436)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#1C1836"/>
    <text x="56" y="68" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">ONE PIECE</text>
    <rect x="12" y="98" width="40" height="16" rx="4" fill="rgba(0,0,0,0.7)"/>
    <text x="32" y="110" fill="#FFB703" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">★ 9.2</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">One Piece</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">Bölüm 1112</text>
  </g>

  <!-- Col 2: Western comics -->
  <g transform="translate(344, 436)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#2E122A"/>
    <text x="56" y="68" fill="#D45398" font-family="sans-serif" font-size="10" text-anchor="middle">INVINCIBLE</text>
    <!-- Publisher badge -->
    <rect x="10" y="96" width="86" height="18" rx="4" fill="#FF007F"/>
    <text x="53" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">IMAGE COMICS</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">Invincible</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">Bölüm 68</text>
  </g>

  <!-- Col 3: Spider-Man (Western) -->
  <g transform="translate(468, 436)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#162238"/>
    <text x="56" y="68" fill="#5885C4" font-family="sans-serif" font-size="10" text-anchor="middle">SPIDER-MAN</text>
    <rect x="12" y="98" width="46" height="16" rx="4" fill="rgba(0,0,0,0.7)"/>
    <text x="35" y="110" fill="#FFB703" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">★ 8.9</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Spider-Man</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">Sayı #32</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(220, 604)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#251A36"/>
    <text x="56" y="68" fill="#A186D4" font-family="sans-serif" font-size="10" text-anchor="middle">JUJUTSU</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Jujutsu Kaisen</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">Bölüm 268</text>
  </g>
  <g transform="translate(344, 604)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#301A24"/>
    <text x="56" y="68" fill="#E67E96" font-family="sans-serif" font-size="9" text-anchor="middle">LITTLE NEMO</text>
    <rect x="10" y="96" width="86" height="18" rx="4" fill="#FF007F"/>
    <text x="53" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">KLASİK</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700">Little Nemo</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">Bölüm 12 (Son)</text>
  </g>
  <g transform="translate(468, 604)">
    <rect width="112" height="154" rx="12" fill="#17142B" stroke="#252042" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#172828"/>
    <text x="56" y="68" fill="#69C2B8" font-family="sans-serif" font-size="10" text-anchor="middle">BATMAN</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Batman: Year One</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">DC Comics</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(194, 888)">
    <rect width="412" height="78" fill="#0A0814" stroke="#1F1B36" stroke-width="1"/>
    <!-- Home (Active) -->
    <text x="52" y="34" fill="#FF007F" font-family="sans-serif" font-size="18" text-anchor="middle">⌂</text>
    <text x="52" y="52" fill="#FF007F" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ana Sayfa</text>

    <!-- Keşfet -->
    <text x="154" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">⚲</text>
    <text x="154" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Keşfet</text>

    <!-- Kitaplık -->
    <text x="256" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">📚</text>
    <text x="256" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Kitaplık</text>

    <!-- Settings -->
    <text x="358" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">⚙</text>
    <text x="358" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Ayarlar</text>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="330" y="952" width="140" height="4" rx="2" fill="#5A5573"/>
</svg>
