# Do not set -Dfile.encoding here. On JDK 17 the Gradle daemon writes the test
# worker @argfile classpath in the daemon charset while java.exe reads that file
# in the platform charset. Forcing UTF-8 on the daemon therefore mangles any
# workspace path with Turkish characters ("Kişisel"), and every test class fails
# with ClassNotFoundException. Leaving it unset keeps both sides on the platform
# charset; UTF-8 for Kotlin sources is set on the Kotlin daemon below.
org.gradle.jvmargs=-Xmx3g
# Sources are UTF-8, so the Kotlin compile daemon needs UTF-8 explicitly; it
# otherwise inherits the platform charset and mis-decodes every Turkish string.
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace path contains Turkish characters; all build files use UTF-8.
android.overridePathCheck=true
kotlin.code.style=official
