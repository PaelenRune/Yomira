<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0A0814"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="180" y="20" width="440" height="960" rx="48" fill="#12101F" stroke="#2D284D" stroke-width="3"/>
  
  <!-- Dimmed Background -->
  <rect x="194" y="34" width="412" height="932" rx="38" fill="#040308"/>
  <rect x="194" y="34" width="412" height="932" rx="38" fill="rgba(0,0,0,0.65)"/>

  <!-- Dynamic Island -->
  <rect x="330" y="46" width="140" height="26" rx="13" fill="#000000"/>

  <!-- Centered Smart Match Modal Sheet -->
  <g transform="translate(216, 260)">
    <!-- Modal Card -->
    <rect width="368" height="420" rx="24" fill="url(#modalBg)" stroke="#9D4EDD" stroke-width="1.5"/>
    
    <!-- Top Sparkle Icon -->
    <circle cx="184" cy="46" r="26" fill="#24143B" stroke="#9D4EDD" stroke-width="1.5"/>
    <text x="184" y="54" fill="#FF007F" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">✦</text>

    <!-- Modal Title -->
    <text x="184" y="104" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800" text-anchor="middle">Akıllı Kaynak Eşleştirici</text>
    <text x="184" y="124" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Seçilen okuma dili: Türkçe (TR)</text>

    <!-- Recommended Source Box -->
    <g transform="translate(24, 146)">
      <rect width="320" height="110" rx="14" fill="#1A1633" stroke="#362E5C" stroke-width="1"/>
      <!-- Source Icon -->
      <rect x="16" y="18" width="42" height="42" rx="10" fill="#9D4EDD"/>
      <text x="37" y="44" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">TR</text>

      <!-- Source Name and Badges -->
      <text x="68" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800">Manga-TR Fansub</text>
      <rect x="68" y="42" width="76" height="18" rx="4" fill="#00C853"/>
      <text x="106" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">145 BÖLÜM</text>

      <rect x="150" y="42" width="58" height="18" rx="4" fill="#2E2452"/>
      <text x="179" y="55" fill="#A186D4" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">GÜNCEL</text>

      <text x="16" y="90" fill="#B3B0C7" font-family="sans-serif" font-size="11">Keiyoushi resmi deposunda onaylanmış kaynak.</text>
    </g>

    <!-- Recommendation Message -->
    <text x="184" y="286" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Bu seriyi Türkçe okumak için bu eklenti gerekli.</text>
    <text x="184" y="304" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Tek tıkla güvenli sandbox ortamına kurulsun mu?</text>

    <!-- Primary Action (Install & Read) -->
    <rect x="24" y="328" width="320" height="44" rx="12" fill="url(#ctaGrad)"/>
    <text x="184" y="355" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Eklentiyi Kur ve Hemen Oku</text>

    <!-- Secondary Action (Cancel / Other Source) -->
    <text x="184" y="396" fill="#8E8D9A" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Farklı Kaynak Seç</text>
  </g>

  <!-- Home Indicator -->
  <rect x="330" y="952" width="140" height="4" rx="2" fill="#5A5573"/>
</svg>
