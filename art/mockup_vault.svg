<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="vaultBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0509"/>
      <stop offset="100%" stop-color="#1A0713"/>
    </linearGradient>
    <linearGradient id="vaultHeroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A0822"/>
      <stop offset="60%" stop-color="#730C36"/>
      <stop offset="100%" stop-color="#1A0713"/>
    </linearGradient>
    <linearGradient id="crimsonNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF0055"/>
      <stop offset="100%" stop-color="#FF3366"/>
    </linearGradient>
  </defs>

  <!-- Phone Body -->
  <rect x="180" y="20" width="440" height="960" rx="48" fill="#1A0713" stroke="#4D132D" stroke-width="3"/>
  <rect x="194" y="34" width="412" height="932" rx="38" fill="url(#vaultBg)"/>

  <!-- Notch -->
  <rect x="330" y="46" width="140" height="26" rx="13" fill="#000000"/>

  <!-- Top App Bar -->
  <text x="224" y="112" fill="url(#crimsonNeon)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1">🔒 YOMIRA VAULT</text>
  
  <!-- Panic Button -->
  <g transform="translate(490, 88)">
    <rect width="90" height="32" rx="10" fill="#FF0055" stroke="#FFA3BF" stroke-width="1"/>
    <text x="45" y="21" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">⚡ PANİK KİLİT</text>
  </g>

  <!-- Category Pills (Adult Webtoon, Hentai Manga, Smut, Doujinshi) -->
  <g transform="translate(220, 136)">
    <rect x="0" y="0" width="100" height="28" rx="8" fill="#FF0055"/>
    <text x="50" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Adult Webtoon</text>

    <rect x="108" y="0" width="94" height="28" rx="8" fill="#290E1D" stroke="#4D1836" stroke-width="1"/>
    <text x="155" y="18" fill="#D98BA8" font-family="sans-serif" font-size="11" text-anchor="middle">Hentai Manga</text>

    <rect x="210" y="0" width="60" height="28" rx="8" fill="#290E1D" stroke="#4D1836" stroke-width="1"/>
    <text x="240" y="18" fill="#D98BA8" font-family="sans-serif" font-size="11" text-anchor="middle">Smut</text>

    <rect x="278" y="0" width="82" height="28" rx="8" fill="#290E1D" stroke="#4D1836" stroke-width="1"/>
    <text x="319" y="18" fill="#D98BA8" font-family="sans-serif" font-size="11" text-anchor="middle">Doujinshi</text>
  </g>

  <!-- Vault Hero Carousel -->
  <g transform="translate(220, 180)">
    <rect width="360" height="190" rx="18" fill="url(#vaultHeroGrad)" stroke="#FF0055" stroke-width="1.2"/>
    <rect x="16" y="16" width="82" height="24" rx="12" fill="rgba(0,0,0,0.7)"/>
    <text x="57" y="32" fill="#FF0055" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">18+ EXPLICIT</text>
    
    <text x="18" y="118" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="18">Silent War</text>
    <text x="18" y="138" fill="#FFB3C6" font-family="sans-serif" font-size="12">Porhwa • Drama • Romantizm</text>
    <rect x="18" y="148" width="110" height="30" rx="8" fill="url(#crimsonNeon)"/>
    <text x="73" y="168" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Kasada Oku</text>
  </g>

  <!-- Section Title -->
  <text x="220" y="404" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="16">Özel Yetişkin Vitrini (Level 2)</text>
  <text x="580" y="404" fill="#FF0055" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="end">Ana Akıştan İzole</text>

  <!-- 3-Column Explicit Grid -->
  <g transform="translate(220, 420)">
    <rect width="112" height="154" rx="12" fill="#240A18" stroke="#42142E" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#3D122A"/>
    <text x="56" y="68" fill="#FFA3C2" font-family="sans-serif" font-size="10" text-anchor="middle">BOARDING DIARY</text>
    <rect x="8" y="96" width="94" height="18" rx="4" fill="#A80D41"/>
    <text x="55" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">EXPLICIT WEBTOON</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Boarding Diary</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">140 Bölüm</text>
  </g>

  <g transform="translate(344, 420)">
    <rect width="112" height="154" rx="12" fill="#240A18" stroke="#42142E" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#3D122A"/>
    <text x="56" y="68" fill="#FFA3C2" font-family="sans-serif" font-size="10" text-anchor="middle">BAD THINKING</text>
    <rect x="8" y="96" width="94" height="18" rx="4" fill="#A80D41"/>
    <text x="55" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">EXPLICIT YURI</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Bad Thinking Di...</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">60 Bölüm</text>
  </g>

  <g transform="translate(468, 420)">
    <rect width="112" height="154" rx="12" fill="#240A18" stroke="#42142E" stroke-width="1"/>
    <rect x="6" y="6" width="100" height="114" rx="8" fill="#3D122A"/>
    <text x="56" y="68" fill="#FFA3C2" font-family="sans-serif" font-size="10" text-anchor="middle">SECRET CLASS</text>
    <rect x="8" y="96" width="94" height="18" rx="4" fill="#A80D41"/>
    <text x="55" y="109" fill="#FFFFFF" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">EXPLICIT PORHWA</text>
    <text x="8" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700">Secret Class</text>
    <text x="8" y="148" fill="#8E8D9A" font-family="sans-serif" font-size="9">195 Bölüm</text>
  </g>

  <!-- Security Banner Info -->
  <g transform="translate(220, 594)">
    <rect width="360" height="70" rx="14" fill="#1F0815" stroke="#FF0055" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="24" y="28" fill="#FF0055" font-family="sans-serif" font-size="13" font-weight="800">🔒 Seviye 2 İzolasyon Koruması Aktif</text>
    <text x="24" y="48" fill="#B38BA1" font-family="sans-serif" font-size="11">Buradaki hiçbir seri genel vitrinde, arama geçmişinde veya ana</text>
    <text x="24" y="62" fill="#B38BA1" font-family="sans-serif" font-size="11">sayfada görünmez. Uygulamadan çıkıldığında otomatik kilitlenir.</text>
  </g>

  <!-- Bottom Navigation Bar (Vault Active) -->
  <g transform="translate(194, 888)">
    <rect width="412" height="78" fill="#0A0814" stroke="#1F1B36" stroke-width="1"/>
    <text x="52" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">⌂</text>
    <text x="52" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Ana Sayfa</text>
    
    <text x="154" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">⚲</text>
    <text x="154" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Keşfet</text>
    
    <text x="256" y="34" fill="#8E8D9A" font-family="sans-serif" font-size="18" text-anchor="middle">📚</text>
    <text x="256" y="52" fill="#8E8D9A" font-family="sans-serif" font-size="11" text-anchor="middle">Kitaplık</text>
    
    <text x="358" y="34" fill="#FF0055" font-family="sans-serif" font-size="18" text-anchor="middle">🔓</text>
    <text x="358" y="52" fill="#FF0055" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">+18 Kasa</text>
  </g>

  <!-- Home Indicator -->
  <rect x="330" y="952" width="140" height="4" rx="2" fill="#7A2447"/>
</svg>
