<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="oledBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="hudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10, 8, 20, 0.95)"/>
      <stop offset="100%" stop-color="rgba(10, 8, 20, 0.7)"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
  </defs>

  <!-- Phone Frame -->
  <rect x="180" y="20" width="440" height="960" rx="48" fill="#12101F" stroke="#2D284D" stroke-width="3"/>
  <rect x="194" y="34" width="412" height="932" rx="38" fill="url(#oledBg)"/>

  <!-- Webtoon Vertical Panels Simulation -->
  <g transform="translate(194, 90)">
    <!-- Comic Panel 1 -->
    <rect x="10" y="0" width="392" height="240" fill="#1A1829" stroke="#2D284D" stroke-width="1"/>
    <text x="206" y="120" fill="#4E4870" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">[ Webtoon Kesintisiz Dikey Akış — Panel 1 ]</text>
    
    <!-- Comic Panel 2 -->
    <rect x="10" y="246" width="392" height="280" fill="#151322" stroke="#2D284D" stroke-width="1"/>
    <text x="206" y="380" fill="#4E4870" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">[ Donanım Hızlandırmalı Render — Panel 2 ]</text>
    
    <!-- Comic Panel 3 -->
    <rect x="10" y="532" width="392" height="260" fill="#12101F" stroke="#2D284D" stroke-width="1"/>
    <text x="206" y="660" fill="#4E4870" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">[ Akıllı Çift Dokunuş Zoom — Panel 3 ]</text>
  </g>

  <!-- Dynamic Island -->
  <rect x="330" y="46" width="140" height="26" rx="13" fill="#000000"/>

  <!-- Top Floating HUD -->
  <g transform="translate(204, 76)">
    <rect width="392" height="56" rx="16" fill="url(#hudGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <!-- Back Arrow -->
    <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="18">←</text>
    <!-- Titles -->
    <text x="56" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800">Solo Leveling: Ragnarok</text>
    <text x="56" y="42" fill="#8E8D9A" font-family="sans-serif" font-size="10">Bölüm 42: Gölge Hükümdarı</text>
    <!-- Reading Mode Chip -->
    <rect x="290" y="14" width="88" height="28" rx="8" fill="#9D4EDD"/>
    <text x="334" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">WEBTOON ▼</text>
  </g>

  <!-- Bottom Floating HUD -->
  <g transform="translate(204, 780)">
    <rect width="392" height="130" rx="20" fill="url(#hudGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Page Slider -->
    <line x1="30" y1="36" x2="362" y2="36" stroke="#2B2745" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="36" x2="180" y2="36" stroke="url(#purpleGlow)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="180" cy="36" r="10" fill="#FF007F" stroke="#FFFFFF" stroke-width="2"/>
    <text x="196" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sayfa 24 / 52 (%46)</text>
    
    <!-- Bottom Controls Row -->
    <g transform="translate(24, 60)">
      <!-- OLED Night Mode Switch -->
      <rect x="0" y="0" width="104" height="34" rx="10" fill="#19162E" stroke="#3D3566" stroke-width="1"/>
      <text x="52" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🌙 OLED Siyah</text>

      <!-- Invert Filter -->
      <rect x="114" y="0" width="104" height="34" rx="10" fill="#19162E" stroke="#3D3566" stroke-width="1"/>
      <text x="166" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ Ters Renk</text>

      <!-- RTL / LTR Toggle -->
      <rect x="228" y="0" width="116" height="34" rx="10" fill="#19162E" stroke="#3D3566" stroke-width="1"/>
      <text x="286" y="21" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔄 RTL (Manga)</text>
    </g>
  </g>

  <!-- Home Indicator -->
  <rect x="330" y="952" width="140" height="4" rx="2" fill="#5A5573"/>
</svg>
